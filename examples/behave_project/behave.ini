[behave]
format = modern-json
outfiles = report.json
paths = features

[behave.formatters]
modern-json = behave_modern_json_report.formatter:ModernJSONFormatter
cucumber-json = behave_modern_json_report.cucumber_formatter:CucumberJSONFormatter

[behave.userdata]
mjr.project_name = Behave Modern JSON Report - Example
mjr.branch = main
mjr.team = qa
mjr.environment = staging
mjr.build_id = local-dev
